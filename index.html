<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.Tech Notes Vault & Math Solver</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Marked.js (Markdown Renderer) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- KaTeX (Math LaTeX Renderer) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .prose pre { background: #0f172a; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
        .prose p { margin-bottom: 0.5rem; }
        .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.5rem 0; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-3">
            <h1 class="text-xl font-bold text-indigo-400">B.Tech Vault & AI Math Solver</h1>
            <div class="flex gap-2">
                <button id="openMathSolverModal" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2 rounded-lg text-sm font-semibold flex items-center gap-1.5">
                    <i class="fa-solid fa-calculator"></i> AI Math Solver
                </button>
                <button id="openFolderModal" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-2 rounded-lg text-sm font-semibold">
                    + New Subject Folder
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 sm:p-6 grid grid-cols-1 md:grid-cols-12 gap-6">
        <!-- Sidebar -->
        <aside class="md:col-span-4 lg:col-span-3 bg-slate-800 border border-slate-700 rounded-2xl p-4">
            <h2 class="text-xs font-semibold text-slate-400 uppercase mb-3">Subject Folders</h2>
            <div id="folderList" class="space-y-2"></div>
        </aside>

        <!-- Content Area -->
        <section class="md:col-span-8 lg:col-span-9 space-y-6">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 flex flex-wrap justify-between items-center gap-4">
                <div>
                    <h2 id="currentFolderName" class="text-xl font-bold text-white">Folder Select Karein</h2>
                    <p id="currentFolderStats" class="text-xs text-slate-400">0 Notes saved</p>
                </div>
                
                <div class="flex items-center gap-2 flex-wrap">
                    <select id="uploadCategorySelect" class="bg-slate-900 border border-slate-700 text-xs text-slate-200 rounded-lg p-2.5 outline-none">
                        <option value="Theory">Theory PDF</option>
                        <option value="Examples">Example PDF</option>
                        <option value="Questions">Question PDF</option>
                    </select>

                    <label id="uploadBtnLabel" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2.5 rounded-lg text-sm cursor-pointer opacity-50 cursor-not-allowed font-medium inline-flex items-center">
                        <i class="fa-solid fa-file-circle-plus mr-1"></i> Upload Image / PDF
                        <input type="file" id="fileInput" accept="image/*,application/pdf" class="hidden" disabled>
                    </label>
                </div>
            </div>

            <!-- Sub-Category Filter Tabs -->
            <div class="flex border-b border-slate-700 gap-2 pb-2 overflow-x-auto">
                <button onclick="filterCategory('All')" class="cat-tab-btn active-tab bg-indigo-600 text-white text-xs px-3.5 py-1.5 rounded-lg font-semibold transition" data-cat="All">All Notes</button>
                <button onclick="filterCategory('Theory')" class="cat-tab-btn bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs px-3.5 py-1.5 rounded-lg font-semibold transition" data-cat="Theory"><i class="fa-solid fa-book-open mr-1 text-amber-400"></i>Theory</button>
                <button onclick="filterCategory('Examples')" class="cat-tab-btn bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs px-3.5 py-1.5 rounded-lg font-semibold transition" data-cat="Examples"><i class="fa-solid fa-lightbulb mr-1 text-emerald-400"></i>Examples</button>
                <button onclick="filterCategory('Questions')" class="cat-tab-btn bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs px-3.5 py-1.5 rounded-lg font-semibold transition" data-cat="Questions"><i class="fa-solid fa-circle-question mr-1 text-cyan-400"></i>Questions</button>
            </div>

            <div id="notesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            
            <div id="emptyState" class="hidden text-center p-12 bg-slate-800/40 border border-dashed border-slate-700 rounded-2xl">
                <p class="text-slate-400 text-sm">Is category mein koi note nahi hai. Photo ya PDF upload karein!</p>
            </div>
        </section>
    </main>

    <!-- Modal for New Folder -->
    <div id="folderModal" class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-md space-y-4">
            <h3 class="text-lg font-bold">New Subject Folder</h3>
            <input type="text" id="folderNameInput" placeholder="Subject Name (e.g. Matrix & Linear Algebra)" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-sm text-white">
            <div class="flex justify-end gap-2">
                <button id="closeModal" class="px-4 py-2 bg-slate-700 rounded-lg text-sm">Cancel</button>
                <button id="saveFolder" class="px-4 py-2 bg-indigo-600 rounded-lg text-sm">Create</button>
            </div>
        </div>
    </div>

    <!-- AI Math Solver Modal -->
    <div id="mathSolverModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-3 sm:p-5 hidden z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-4xl max-h-[92vh] flex flex-col overflow-hidden shadow-2xl">
            <!-- Modal Header -->
            <div class="p-4 bg-slate-800/90 border-b border-slate-700 flex justify-between items-center">
                <h3 class="text-lg font-bold text-emerald-400 flex items-center gap-2">
                    <i class="fa-solid fa-square-root-variable"></i> AI Math & Matrix Question Solver
                </h3>
                <button id="closeMathSolver" class="text-slate-400 hover:text-white text-xl px-2">&times;</button>
            </div>

            <!-- Modal Body -->
            <div class="p-4 sm:p-6 overflow-y-auto space-y-4 flex-1">
                <!-- API Key Section -->
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700 flex flex-wrap items-center justify-between gap-2">
                    <span class="text-xs text-slate-300 font-medium">Custom Gemini API Key:</span>
                    <input type="password" id="apiKeyInput" placeholder="Apni Gemini API key paste karein" class="bg-slate-900 border border-slate-700 text-xs text-white rounded px-3 py-1.5 flex-1 min-w-[200px]">
                    <button id="saveApiKey" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded text-white font-medium">Save Key</button>
                </div>

                <!-- Input Section -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-3">
                        <label class="block text-xs font-semibold text-slate-300">1. Question Likhien (Text / Matrix):</label>
                        <textarea id="mathQuestionText" rows="4" placeholder="Calculus, Matrix, Vectors, ya koi bhi math question yahan likhein..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500"></textarea>
                    </div>

                    <div class="space-y-3">
                        <label class="block text-xs font-semibold text-slate-300">2. Ya Matrix / Question ki Photo Upload Karein:</label>
                        <input type="file" id="mathQuestionImg" accept="image/*" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-xs text-slate-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-emerald-600 file:text-white file:text-xs">
                        <div id="imagePreviewContainer" class="hidden relative mt-2">
                            <img id="mathImgPreview" class="max-h-32 rounded-lg border border-slate-700 object-contain">
                        </div>
                    </div>
                </div>

                <!-- Formatting Instruction -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">3. Custom Formatting Instruction:</label>
                    <input type="text" id="mathInstruction" value="Agar Matrix ka question hai toh strictly Latex matrix format (\\begin{bmatrix}...\\end{bmatrix}) ka use karke visual matrix form me answer do, plain text me mat likho. Basic level se step-by-step solve karo." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-200">
                </div>

                <!-- Solve Action Button -->
                <button id="solveMathBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Step-by-Step Solve Karein
                </button>

                <!-- Solution Display Output -->
                <div id="solutionBox" class="hidden bg-slate-900 border border-slate-700 rounded-2xl p-4 sm:p-5 space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-3 flex-wrap gap-2">
                        <h4 class="font-bold text-emerald-400 text-sm" id="solutionHeaderTitle">Step-by-Step Matrix Solution:</h4>
                        <button id="saveSolutionAsNote" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium flex items-center gap-1">
                            <i class="fa-solid fa-file-pdf"></i> Download PDF Copy
                        </button>
                    </div>
                    <div id="solutionContent" class="prose prose-invert max-w-none text-slate-200 text-sm space-y-2"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- PDF Canvas Direct Viewer Modal -->
    <div id="pdfViewerModal" class="fixed inset-0 bg-black/85 flex flex-col hidden z-50 p-2 sm:p-4">
        <div class="flex justify-between items-center mb-3 bg-slate-800 p-3 rounded-lg border border-slate-700">
            <h3 id="viewerTitle" class="text-white font-bold truncate">PDF Preview</h3>
            <button id="closeViewer" class="text-white bg-red-600 hover:bg-red-500 px-3 py-1 rounded text-sm font-semibold">Close</button>
        </div>
        <div id="pdfCanvasContainer" class="flex-1 overflow-y-auto bg-slate-900 border border-slate-700 rounded-lg p-2 sm:p-4 flex flex-col items-center"></div>
    </div>

    <!-- Loader Overlay -->
    <div id="loaderOverlay" class="fixed inset-0 bg-black/70 z-50 flex-col items-center justify-center hidden">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-cyan-500 border-t-transparent mb-3"></div>
        <p id="loaderText" class="text-sm font-medium text-white">Loading...</p>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const defaultSubjects = [
            { id: 'matrix_maths', name: 'Matrix & Linear Algebra' },
            { id: 'maths1', name: 'Engineering Mathematics-I' },
            { id: 'physics', name: 'Engineering Physics' }
        ];

        let state = {
            folders: JSON.parse(localStorage.getItem('btech_folders')) || defaultSubjects,
            currentFolderId: null,
            activeCategory: 'All',
            db: null,
            latestSolutionMarkdown: '',
            questionNo: parseInt(localStorage.getItem('matrix_q_no') || '1')
        };

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('BTechNotesDB_v5', 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('pdfNotes')) {
                        const store = db.createObjectStore('pdfNotes', { keyPath: 'id' });
                        store.createIndex('folderId', 'folderId', { unique: false });
                        store.createIndex('category', 'category', { unique: false });
                    }
                };
                request.onsuccess = (e) => {
                    state.db = e.target.result;
                    resolve();
                };
                request.onerror = (e) => reject(e);
            });
        }

        async function init() {
            try {
                await initDB();
                renderFolders();
                if (state.folders.length > 0) selectFolder(state.folders[0].id);

                const savedKey = localStorage.getItem('gemini_api_key');
                if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
            } catch(e) {
                console.error("DB Initialization error", e);
            }
        }

        function showLoader(msg) {
            document.getElementById('loaderText').textContent = msg;
            document.getElementById('loaderOverlay').classList.remove('hidden');
            document.getElementById('loaderOverlay').classList.add('flex');
        }

        function hideLoader() {
            document.getElementById('loaderOverlay').classList.add('hidden');
            document.getElementById('loaderOverlay').classList.remove('flex');
        }

        function renderFolders() {
            const list = document.getElementById('folderList');
            list.innerHTML = '';
            state.folders.forEach(f => {
                const isActive = f.id === state.currentFolderId;
                const div = document.createElement('div');
                div.className = `w-full p-3 rounded-xl border flex justify-between items-center cursor-pointer transition ${isActive ? 'bg-indigo-600/30 border-indigo-500 text-indigo-300 font-semibold' : 'bg-slate-800/80 border-slate-700 hover:bg-slate-700 text-slate-200'}`;
                
                div.onclick = (e) => {
                    if (!e.target.closest('.delete-folder-btn')) {
                        selectFolder(f.id);
                    }
                };
                
                div.innerHTML = `
                    <span class="truncate pr-2"><i class="fa-solid fa-folder mr-2"></i>${f.name}</span>
                    <button title="Delete Folder" class="delete-folder-btn text-slate-400 hover:text-red-400 p-1 text-xs transition" onclick="deleteFolder('${f.id}', event)">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                `;
                list.appendChild(div);
            });
        }

        async function deleteFolder(folderId, event) {
            if (event) event.stopPropagation();
            if (state.folders.length <= 1) {
                alert("Kam se kam ek subject folder hona zaroori hai!");
                return;
            }
            if (!confirm("Kya aap is folder aur iske saare notes ko delete karna chahte hain?")) return;

            const notes = await getNotesFromDB(folderId);
            for (const note of notes) {
                await deleteNoteFromDB(note.id);
            }

            state.folders = state.folders.filter(f => f.id !== folderId);
            localStorage.setItem('btech_folders', JSON.stringify(state.folders));

            if (state.currentFolderId === folderId) {
                selectFolder(state.folders[0].id);
            } else {
                renderFolders();
            }
        }

        async function selectFolder(id) {
            state.currentFolderId = id;
            renderFolders();
            const folder = state.folders.find(f => f.id === id);
            document.getElementById('currentFolderName').textContent = folder ? folder.name : 'Select Folder';
            
            const fileInput = document.getElementById('fileInput');
            const label = document.getElementById('uploadBtnLabel');
            fileInput.disabled = false;
            label.classList.remove('opacity-50', 'cursor-not-allowed');

            await renderNotes();
        }

        function filterCategory(category) {
            state.activeCategory = category;
            document.querySelectorAll('.cat-tab-btn').forEach(btn => {
                if (btn.dataset.cat === category) {
                    btn.className = "cat-tab-btn bg-indigo-600 text-white text-xs px-3.5 py-1.5 rounded-lg font-semibold transition";
                } else {
                    btn.className = "cat-tab-btn bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs px-3.5 py-1.5 rounded-lg font-semibold transition";
                }
            });
            renderNotes();
        }

        async function renderNotes() {
            if (!state.currentFolderId) return;
            const grid = document.getElementById('notesGrid');
            const empty = document.getElementById('emptyState');
            grid.innerHTML = '';

            let notes = await getNotesFromDB(state.currentFolderId);
            const totalCount = notes.length;

            if (state.activeCategory !== 'All') {
                notes = notes.filter(n => (n.category || 'Questions') === state.activeCategory);
            }

            document.getElementById('currentFolderStats').textContent = `${totalCount} note(s) saved overall`;

            if (notes.length === 0) {
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            notes.forEach(note => {
                const categoryTag = note.category || 'Questions';
                let catBadgeColor = 'bg-cyan-500/20 text-cyan-300 border-cyan-500/30';
                if (categoryTag === 'Theory') catBadgeColor = 'bg-amber-500/20 text-amber-300 border-amber-500/30';
                if (categoryTag === 'Examples') catBadgeColor = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30';

                const card = document.createElement('div');
                card.className = "bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col justify-between shadow-lg hover:border-slate-600 transition";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <i class="fa-solid fa-file-pdf text-red-400 text-2xl"></i>
                            <span class="text-[10px] font-semibold px-2 py-0.5 rounded border ${catBadgeColor}">${categoryTag}</span>
                        </div>
                        <h4 class="text-sm font-semibold text-white truncate" title="${note.name}">${note.name}</h4>
                        <p class="text-xs text-slate-400 mb-3">${(note.size / (1024*1024)).toFixed(2)} MB</p>
                    </div>
                    <div class="flex gap-1.5 pt-2 border-t border-slate-700/60">
                        <button onclick="viewPDF('${note.id}')" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs py-1.5 rounded-lg font-medium flex items-center justify-center gap-1">
                            <i class="fa-solid fa-eye"></i> Open
                        </button>
                        <button onclick="shareNote('${note.id}')" title="Forward/Share PDF" class="bg-emerald-600/30 hover:bg-emerald-600/50 text-emerald-300 text-xs px-2.5 py-1.5 rounded-lg font-medium flex items-center justify-center">
                            <i class="fa-solid fa-share-nodes"></i>
                        </button>
                        <button onclick="deleteNote('${note.id}')" title="Delete PDF" class="bg-red-600/30 hover:bg-red-600/50 text-red-400 text-xs px-2.5 py-1.5 rounded-lg">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function shareNote(id) {
            const note = await getNoteById(id);
            if (!note) return;

            try {
                const pdfFile = new File([note.blob], note.name, { type: 'application/pdf' });
                if (navigator.share && navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
                    await navigator.share({
                        files: [pdfFile],
                        title: note.name,
                        text: `B.Tech Note: ${note.name}`
                    });
                } else {
                    const url = URL.createObjectURL(note.blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = note.name;
                    a.click();
                    URL.revokeObjectURL(url);
                    alert("Direct share support nahi hai, PDF device me download ho gayi hai.");
                }
            } catch (err) {
                console.log("Sharing cancelled or error:", err);
            }
        }

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || !state.currentFolderId) return;

            const category = document.getElementById('uploadCategorySelect').value || 'Questions';
            showLoader('File Process ho rahi hai...');

            try {
                if (file.type === 'application/pdf') {
                    await saveNoteToDB({
                        id: 'note_' + Date.now(),
                        folderId: state.currentFolderId,
                        category: category,
                        name: file.name,
                        size: file.size,
                        blob: file
                    });
                } else if (file.type.startsWith('image/')) {
                    showLoader('Photo ko PDF mein convert kiya ja raha hai...');
                    const pdfBlob = await imageToPDF(file);
                    const pdfName = file.name.split('.')[0] + `_${category}.pdf`;
                    
                    await saveNoteToDB({
                        id: 'note_' + Date.now(),
                        folderId: state.currentFolderId,
                        category: category,
                        name: pdfName,
                        size: pdfBlob.size,
                        blob: pdfBlob
                    });
                } else {
                    alert('Kripya sirf Photo (JPG/PNG/WebP) ya PDF file hi chunein!');
                }
                renderNotes();
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                hideLoader();
                e.target.value = '';
            }
        });

        function imageToPDF(file) {
            return new Promise((resolve, reject) => {
                if (!window.jspdf) {
                    reject(new Error("jsPDF library load nahi hui."));
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);

                        const imgData = canvas.toDataURL('image/jpeg', 0.95);
                        const { jsPDF } = window.jspdf;
                        const orientation = img.width > img.height ? 'l' : 'p';
                        const doc = new jsPDF(orientation, 'pt', 'a4');
                        
                        const pw = doc.internal.pageSize.getWidth();
                        const ph = doc.internal.pageSize.getHeight();
                        const ratio = Math.min(pw / img.width, ph / img.height);
                        
                        const w = img.width * ratio;
                        const h = img.height * ratio;
                        const x = (pw - w) / 2;
                        const y = (ph - h) / 2;

                        doc.addImage(imgData, 'JPEG', x, y, w, h);
                        resolve(doc.output('blob'));
                    };
                    img.onerror = () => reject(new Error("Image read nahi ho pa rahi"));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error("File open nahi ho pa rahi"));
                reader.readAsDataURL(file);
            });
        }

        async function viewPDF(id) {
            const note = await getNoteById(id);
            if (!note) return;

            const container = document.getElementById('pdfCanvasContainer');
            container.innerHTML = ''; 
            document.getElementById('viewerTitle').textContent = note.name;
            document.getElementById('pdfViewerModal').classList.remove('hidden');

            showLoader('PDF Render ho rahi hai...');

            try {
                const arrayBuffer = await note.blob.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 1.2 });

                    const canvas = document.createElement('canvas');
                    canvas.className = "mb-4 rounded shadow border border-slate-700 max-w-full";
                    const context = canvas.getContext('2d');
                    
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    container.appendChild(canvas);
                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                }
            } catch (err) {
                alert('PDF Open karne mein error: ' + err.message);
            } finally {
                hideLoader();
            }
        }

        document.getElementById('saveApiKey').onclick = () => {
            const key = document.getElementById('apiKeyInput').value.trim();
            if(!key) return alert('Kripya valid Gemini API key daalein');
            localStorage.setItem('gemini_api_key', key);
            alert('Custom API Key save ho gayi!');
        };

        document.getElementById('mathQuestionImg').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    document.getElementById('mathImgPreview').src = evt.target.result;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // Helper function to safely combine Marked and KaTeX without corrupting LaTeX
        function renderMarkdownWithKaTeX(markdownText, containerElement) {
            const mathBlocks = [];
            
            // Protect LaTeX blocks ($$...$$ , $...$, \begin{...}...\end{...}) from Marked parser
            let protectedText = markdownText.replace(/(\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)|(?<!\\)\$[^\$\n]+?\$|\\begin\{[a-z]*\*?\}[\s\S]*?\\end\{[a-z]*\*?\})/gi, (match) => {
                mathBlocks.push(match);
                return `%%%MATHBLOCK_${mathBlocks.length - 1}%%%`;
            });

            // Parse Markdown safely
            let html = marked.parse(protectedText);

            // Restore LaTeX blocks
            html = html.replace(/%%%MATHBLOCK_(\d+)%%%/g, (_, index) => {
                return mathBlocks[index];
            });

            containerElement.innerHTML = html;

            // Render math equations with KaTeX
            renderMathInElement(containerElement, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true}
                ],
                throwOnError: false
            });
        }

        // AI Math Solver API Request
        document.getElementById('solveMathBtn').onclick = async () => {
            const textInput = document.getElementById('mathQuestionText').value.trim();
            const imgInput = document.getElementById('mathQuestionImg').files[0];
            const instruction = document.getElementById('mathInstruction').value.trim();

            if (!textInput && !imgInput) {
                alert('Kripya question ka text likhein ya photo upload karein!');
                return;
            }

            const apiKey = document.getElementById('apiKeyInput').value.trim() || localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                alert('Kripya Gemini API Key daalein!');
                return;
            }

            showLoader('AI Math & Matrix Problem solve kar raha hai...');

            let parts = [];
            let promptText = `Aap ek expert Mathematics teacher ho. Is question ko step-by-step solve karo.\n\nInstruction: ${instruction}\n\nStrict Latex Rules: Matrix ko compulsory LaTeX matrix syntax me represent karo (e.g., \\begin{bmatrix} a & b \\\\ c & d \\end{bmatrix}). Block math ke liye $$...$$ aur inline ke liye $...$ use karein.`;

            if (textInput) {
                promptText += `\n\nQuestion Text (Question #${state.questionNo}):\n${textInput}`;
            }

            parts.push({ text: promptText });

            try {
                if (imgInput) {
                    const base64Data = await fileToBase64(imgInput);
                    parts.push({
                        inlineData: {
                            mimeType: imgInput.type || 'image/jpeg',
                            data: base64Data.split(',')[1]
                        }
                    });
                }

                // Updated REST Endpoint URL with current active model (gemini-3.6-flash)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: parts }] })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const answerMarkdown = data.candidates[0].content.parts[0].text;
                state.latestSolutionMarkdown = answerMarkdown;

                document.getElementById('solutionHeaderTitle').textContent = `Step-by-Step Solution (QUESTION #${state.questionNo})`;

                // Render Answer with LaTeX Safety Protection
                const solContent = document.getElementById('solutionContent');
                renderMarkdownWithKaTeX(answerMarkdown, solContent);

                document.getElementById('solutionBox').classList.remove('hidden');
                
                // Automatically Save PDF into QUESTIONS folder
                await autoSaveQuestionPDF();

                solContent.scrollIntoView({ behavior: 'smooth' });

            } catch (err) {
                alert('Error Solving Question: ' + err.message);
            } finally {
                hideLoader();
            }
        };

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = (error) => reject(error);
            });
        }

        async function autoSaveQuestionPDF() {
            if (!state.currentFolderId || !state.latestSolutionMarkdown) return;

            try {
                // Short delay to ensure KaTeX DOM layout finishes
                await new Promise(res => setTimeout(res, 350));

                const { jsPDF } = window.jspdf;
                const element = document.getElementById('solutionContent');
                
                const canvas = await html2canvas(element, { scale: 2, backgroundColor: '#0f172a' });
                const imgData = canvas.toDataURL('image/png');
                
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();
                const imgWidth = pdfWidth;
                const imgHeight = (canvas.height * pdfWidth) / canvas.width;

                let heightLeft = imgHeight;
                let position = 0;

                pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                heightLeft -= pdfHeight;

                while (heightLeft > 0) {
                    position = heightLeft - imgHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                    heightLeft -= pdfHeight;
                }

                const pdfBlob = pdf.output('blob');
                const noteName = `Question_No_${state.questionNo}.pdf`;
                
                await saveNoteToDB({
                    id: 'note_' + Date.now(),
                    folderId: state.currentFolderId,
                    category: 'Questions',
                    name: noteName,
                    size: pdfBlob.size,
                    blob: pdfBlob
                });

                state.questionNo++;
                localStorage.setItem('matrix_q_no', state.questionNo.toString());

                await renderNotes();

            } catch (err) {
                console.error('Auto PDF Save Error:', err);
            }
        }

        // Manual PDF Download Button
        document.getElementById('saveSolutionAsNote').onclick = async () => {
            const element = document.getElementById('solutionContent');
            if(!element.innerText.trim()) return;

            const { jsPDF } = window.jspdf;
            const canvas = await html2canvas(element, { scale: 2, backgroundColor: '#0f172a' });
            const imgData = canvas.toDataURL('image/png');
            
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();
            const imgWidth = pdfWidth;
            const imgHeight = (canvas.height * pdfWidth) / canvas.width;

            let heightLeft = imgHeight;
            let position = 0;

            pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
            heightLeft -= pdfHeight;

            while (heightLeft > 0) {
                position = heightLeft - imgHeight;
                pdf.addPage();
                pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                heightLeft -= pdfHeight;
            }

            pdf.save(`Math_Solution_Q${state.questionNo-1}.pdf`);
        };

        // DB Operations
        function getNotesFromDB(folderId) {
            return new Promise((resolve) => {
                if(!state.db) return resolve([]);
                const tx = state.db.transaction(['pdfNotes'], 'readonly');
                const store = tx.objectStore('pdfNotes');
                const index = store.index('folderId');
                const req = index.getAll(folderId);
                req.onsuccess = () => resolve(req.result || []);
            });
        }

        function getNoteById(id) {
            return new Promise((resolve) => {
                if(!state.db) return resolve(null);
                const tx = state.db.transaction(['pdfNotes'], 'readonly');
                const req = tx.objectStore('pdfNotes').get(id);
                req.onsuccess = () => resolve(req.result);
            });
        }

        function saveNoteToDB(note) {
            return new Promise((resolve, reject) => {
                if(!state.db) return reject(new Error("Database loaded nahi hai"));
                const tx = state.db.transaction(['pdfNotes'], 'readwrite');
                const store = tx.objectStore('pdfNotes');
                const req = store.add(note);
                req.onsuccess = () => resolve();
                req.onerror = (e) => reject(e);
            });
        }

        function deleteNoteFromDB(id) {
            return new Promise((resolve) => {
                if(!state.db) return resolve();
                const tx = state.db.transaction(['pdfNotes'], 'readwrite');
                tx.objectStore('pdfNotes').delete(id);
                tx.oncomplete = () => resolve();
            });
        }

        async function deleteNote(id) {
            if(!confirm("Kya is note ko delete karna hai?")) return;
            await deleteNoteFromDB(id);
            renderNotes();
        }

        // Modal Controls
        document.getElementById('openFolderModal').onclick = () => document.getElementById('folderModal').classList.remove('hidden');
        document.getElementById('closeModal').onclick = () => document.getElementById('folderModal').classList.add('hidden');
        document.getElementById('openMathSolverModal').onclick = () => document.getElementById('mathSolverModal').classList.remove('hidden');
        document.getElementById('closeMathSolver').onclick = () => document.getElementById('mathSolverModal').classList.add('hidden');
        
        document.getElementById('closeViewer').onclick = () => {
            document.getElementById('pdfViewerModal').classList.add('hidden');
            document.getElementById('pdfCanvasContainer').innerHTML = '';
        };

        document.getElementById('saveFolder').onclick = () => {
            const name = document.getElementById('folderNameInput').value.trim();
            if(!name) return alert('Subject name daalein');
            const newF = { id: 'folder_' + Date.now(), name };
            state.folders.push(newF);
            localStorage.setItem('btech_folders', JSON.stringify(state.folders));
            document.getElementById('folderNameInput').value = '';
            document.getElementById('folderModal').classList.add('hidden');
            renderFolders();
            selectFolder(newF.id);
        };

        init();
    </script>
</body>
